[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edukasi-agent"
version = "2.0.0"
description = "Agent otonom: riset tren → tulis skrip → ACC manusia → render video → paket upload TikTok"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "edge-tts>=6.1",
    "imageio-ffmpeg>=0.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anim = ["manim>=0.18"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["out", "data", "assets"]

[tool.ruff.lint]
# E/F = bug nyata & sisa import. W = peringatan. Gaya visual (E501 panjang baris)
# sengaja diabaikan: kode ini banyak mengandung teks Indonesia panjang.
select = ["E4", "E7", "E9", "F", "W6"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]        # fixture import kadang dipakai lewat nama

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
