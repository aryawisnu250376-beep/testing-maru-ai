name: Publish Arena AI reports to Notion

on:
  workflow_run:
    workflows: [Arena Report Ingest]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: arena-notion-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/arena-report-ingest.yml' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # Configure this environment to restrict deployments to the exact default branch.
    # Store NOTION_TOKEN only in this environment, never as a repository/org secret.
    environment: arena-report-publisher
    env:
      REPORT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the default branch snapshot for this workflow_run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Stage only immutable Markdown blobs changed at report commit
        env:
          REPORT_GITHUB_TOKEN: ${{ github.token }}
        run: python3.12 -I scripts/publish_report_to_notion.py stage
      - name: Publish and verify in Agent Documents
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: python3.12 -I scripts/publish_report_to_notion.py publish
