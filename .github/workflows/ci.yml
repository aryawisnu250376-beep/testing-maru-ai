name: MARU Comprehensive CI & Security Verification (Phase 6.1.5)

on:
  push:
    branches:
      - main
      - fix/**
      - feat/**
  pull_request:
    branches:
      - main
      - fix/**
      - feat/**

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js for Academic JS Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev

      - name: Install All Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy edge-tts PyYAML pypdf youtube-transcript-api pytest python-dotenv fastapi uvicorn aiosqlite openai python-multipart google-api-python-client httpx

      - name: Run MARU HQ Canonical Test Suite (33 Tests)
        run: |
          python -m tests.hq.run_all

      - name: Run Phase 6.1.5 Comprehensive Security & Token Authority Suite (5 Tests)
        run: |
          python -m unittest tests/test_phase615_security.py -v

      - name: Run Academic AI Node.js Agent Office Tests
        working-directory: 02-academic-ai
        run: |
          node tests/test_agent_office.js
          node tests/test_web_ui.js

      - name: Run Academic AI Python Test Suite (129 Tests - Linux)
        if: runner.os == 'Linux'
        run: |
          python -c "import sys, pytest; sys.path.insert(0, '02-academic-ai'); sys.exit(pytest.main(['02-academic-ai/tests', '-q']))"

      - name: Run Academic AI Python Test Suite (129 Tests - Windows)
        if: runner.os == 'Windows'
        working-directory: 02-academic-ai
        run: |
          python -m pytest tests -q -p no:warnings -o "pythonpath=."

      - name: Run Phase 6.1.3 & 6.1.4 Auth, Isolation & Rendering Security Suite (Linux)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_auth_and_rendering.py -v

      - name: Run Phase 6.1.3 & 6.1.4 Auth, Isolation & Rendering Security Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p "test_auth_and_rendering.py" -v
