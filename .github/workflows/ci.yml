name: MARU HQ CI & Automated Verification

on:
  push:
    branches: [main, fix/*, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Codebase Integrity & Canonical Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (ffmpeg, libcairo2, libpango)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy edge-tts PyYAML pypdf youtube-transcript-api pytest

      - name: Syntax & Import Validation (64+ Files)
        run: |
          python -c "
          import py_compile
          import glob
          files = glob.glob('src/**/*.py', recursive=True) + glob.glob('01-social-media-agent/src/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True)
          print(f'Checking syntax for {len(files)} files...')
          for f in files:
              py_compile.compile(f, doraise=True)
          print('All Python files have valid syntax!')
          "

      - name: Run Authentication & Office Rendering Tests (Priority 1 & 2)
        run: |
          python -m unittest tests/test_auth_and_rendering.py -v

      - name: Run HQ Core Canonical Hardened Engine Tests (33 Checks)
        run: |
          python -m tests.hq.run_all

      - name: Run Division Pipeline Tests (01-social-media-agent)
        run: |
          cd 01-social-media-agent
          python -m pytest tests/test_pipeline.py -q
